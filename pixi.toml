[project]
name = "resistance_detector"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.8"
blast = ">=2.10"
biopython = ">=1.78"
seqkit = ">=2.3"
gamma = "*"

[tasks]
simulate = "PYTHONPATH=. python scripts/simulate_esbl_genomes.py"
test = "python -m pytest tests/ -v"
