name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Pure-Python unit tests (no external bioinformatics tools needed) ──
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "biopython>=1.78" "pytest>=7.0"

      - name: Install package (editable)
        run: pip install -e . --no-deps

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

  # ── Job 2: Integration tests with full bioinformatics environment ─────────────
  integration-tests:
    name: Integration Tests (conda)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge (mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: resistance_detector
          environment-file: environment.yaml
          auto-activate-base: false

      - name: Download GAMMA_DB_Maker
        run: |
          wget -q https://raw.githubusercontent.com/rastanton/GAMMA_DB_Maker/main/GAMMA_DB_Maker.py
          chmod +x GAMMA_DB_Maker.py

      - name: Verify tool availability
        run: |
          python --version
          blastn -version
          GAMMA.py -h | head -1
          seqkit version
          python GAMMA_DB_Maker.py --help 2>&1 | head -3 || python GAMMA_DB_Maker.py 2>&1 | head -3 || true
          python -m pytest --version

      - name: Install package into conda env
        run: pip install -e . --no-deps

      - name: Verify create-db command
        run: |
          fos-cazavi create-db --email ci@example.com --output test_db_dir --prefix ci_test_db
          ls -l test_db_dir/
          if [ ! -f "test_db_dir/ci_test_db.fasta" ]; then echo "Database not created!"; exit 1; fi

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

  # ── Job 3: Lint / code style ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install flake8

      - name: Lint with flake8
        run: |
          # Fail on syntax errors or undefined names
          flake8 fos_cazavi/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Report style issues without failing the build
          flake8 fos_cazavi/ --count --max-line-length=100 --statistics --exit-zero
